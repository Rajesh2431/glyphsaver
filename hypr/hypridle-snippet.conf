# Example hypridle integration (idle -> screensaver -> lock).
# Merge into ~/.config/hypr/hypridle.conf. Timeouts are seconds since idle began.
#
# listener {
#   timeout = 150
#   on-timeout = glyphsaver   (or ~/.local/bin/glyphsaver)
# }
# listener {
#   timeout = 300
#   on-timeout = hyprlock
# }
