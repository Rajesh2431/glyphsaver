# Fallback rules for Hyprland < 0.53 (legacy windowrulev2 syntax).
# Newer Hyprland: use screensaver.conf instead (picked automatically by `setup`).
windowrulev2 = float, class:glyphsaver
windowrulev2 = fullscreen, class:glyphsaver
windowrulev2 = noborder, class:glyphsaver
windowrulev2 = noshadow, class:glyphsaver

# Optional keybind (uncomment, fix path):
# bindd = SUPER, Escape, Omarchy-style screensaver, exec, ~/.local/bin/glyphsaver force
