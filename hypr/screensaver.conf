# Hyprland rules for the screensaver (Hyprland >= 0.53 new syntax).
# Source from hyprland.conf:  source = /path/to/screen-saver/hypr/screensaver.conf
windowrule {
  name = screensaver-fullscreen
  match:class = glyphsaver
  fullscreen = 1
  float = 1
}
windowrule {
  name = screensaver-noanim
  match:class = glyphsaver
  no_anim = 1
  noborder = 1
  noshadow = 1
  idle_inhibit = always
}

# Optional keybind: Super+Esc forces the screensaver (like Omarchy).
# Adjust the path to where you cloned this folder.
# bindd = SUPER, Escape, Omarchy-style screensaver, exec, /home/dog/Projects/learning/linux/screen-saver/launch-screensaver force
